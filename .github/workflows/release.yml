# Push a tag like v0.14.0, or run it by hand (Actions → Release → Run workflow: the tag is made
# from the version in the files) → tests, then the Android APK, the Windows installer and the Mac
# builds, published together as one GitHub Release (the apps check it for updates).
# The APK is signed only when the repository secrets ANDROID_KEYSTORE_B64 and
# ANDROID_KEYSTORE_PASSWORD are set (see docs/RELEASING.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag, Android and desktop versions agree
        run: |
          android="$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" android/app/build.gradle)"
          desktop="$(node -p 'require("./desktop/package.json").version')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="${GITHUB_REF_NAME#v}"; else tag="$android"; fi
          echo "tag=$tag android=$android desktop=$desktop"
          test "$tag" = "$android" && test "$tag" = "$desktop"
          test -f "docs/releases/v$tag.md"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "tag=v$tag" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Desktop tests
        working-directory: desktop
        run: npm ci && npm test
      - name: Android unit tests
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          ./gradlew testReleaseUnitTest --no-daemon
      - name: UI tests (Chromium)
        run: |
          npm install -g playwright@1.56.1
          npx playwright install --with-deps chromium
          NODE_PATH="$(npm root -g)" node android/tests/ui.test.cjs
          NODE_PATH="$(npm root -g)" node desktop/test/e2e/ui.e2e.cjs

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Signed APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD are not set: no APK in this release"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/signing/password.txt"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          SIGNING_FILE="$RUNNER_TEMP/signing/release.jks" SIGNING_PASS_FILE="$RUNNER_TEMP/signing/password.txt" android/build.sh
          rm -rf "$RUNNER_TEMP/signing"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/build/theta-meishi-hatch-*.apk
          if-no-files-found: ignore

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Installer and zip
        working-directory: desktop
        run: npm ci && npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/*.zip
            desktop/dist/latest.yml
          if-no-files-found: error

  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: dmg and zip (Apple silicon and Intel)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm ci && npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest-mac.yml
          if-no-files-found: error

  release:
    needs: [check, android, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          ls -la out
          # Re-running (e.g. after adding the signing secrets) adds or replaces the files.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            # Run by hand, the tag is created on this commit.
            gh release create "$TAG" out/* \
              --target "$GITHUB_SHA" \
              --title "Theta Meishi Hatch ${{ needs.check.outputs.version }}" \
              --notes-file "docs/releases/$TAG.md"
          fi
