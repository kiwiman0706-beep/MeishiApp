plugins { id 'com.android.application' }
android {
    namespace 'jp.yaegaki.meishinote'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId 'jp.yaegaki.meishiclaude'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '0.15.3'
    }
    testOptions {
        unitTests.all {
            // Robolectric fetches its Android runtime jar; use the same Maven Central mirror as Gradle.
            systemProperty 'robolectric.dependency.repo.url', System.getenv('ROBOLECTRIC_REPO') ?: 'https://repo1.maven.org/maven2'
            systemProperty 'robolectric.offline', System.getenv('ROBOLECTRIC_OFFLINE') ?: 'false'
            environment 'REAL_ZIP', System.getenv('REAL_ZIP') ?: ''
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies {
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'org.snakeyaml:snakeyaml-engine:2.7'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.13'

}
